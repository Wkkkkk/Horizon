name: Deploy Docs

on:
  push:
    branches: [main]
    paths: ['docs/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # Needed to re-run the managed Pages deployment on transient failure
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Verify Pages deployment (auto-retry transient failures)
        timeout-minutes: 30
        uses: ./.github/actions/verify-pages-deploy
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
